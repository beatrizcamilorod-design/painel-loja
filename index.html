<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Smart Docs">
<title>Smart Docs · Painel da loja</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<style>
@font-face{font-family:Inter;src:url(assets/fonts/inter.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{
  --navy:#0f2a4a; --navy-2:#1d3d63; --sky:#dbe7f5; --bg:#eef2f7; --card:#fff; --soft:#f8fafc;
  --text:#0f2a4a; --muted:#64748b; --line:#e2e8f0;
  --orange:#f59e0b; --orange-bg:#fff4e0; --orange-ink:#b45309;
  --red:#e5484d; --red-bg:#fdecee; --red-ink:#c0283c;
  --green:#16a36a; --green-bg:#e8f7ef;
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.app{max-width:1100px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:21px;letter-spacing:-.02em}
.logo i{font-style:normal;color:var(--orange)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--sky);display:grid;place-items:center;font-weight:700}
.date{font-size:13px;color:var(--muted);margin-top:16px;text-transform:lowercase}
h1{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:0 0 14px}
.layout{display:grid;gap:12px}
@media (min-width:900px){.layout{grid-template-columns:1fr 1fr;align-items:start}.col{display:grid;gap:12px}}
.col{display:grid;gap:12px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 1px 2px rgba(15,42,74,.04)}
.card h2{font-size:16.5px;font-weight:800;letter-spacing:-.01em;margin:0}
.hero{background:var(--navy);color:#fff;border-radius:24px;padding:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero::before{content:"";position:absolute;right:30px;bottom:-60px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.04)}
.hero .lbl{font-size:13px;opacity:.75}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:4px 0 10px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;background:rgba(255,255,255,.12);border-radius:999px;padding:4px 10px}
.alert{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:14px;border-left:5px solid var(--orange)}
.alert.red{border-left-color:var(--red)}
.alert .ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--orange-bg);display:grid;place-items:center;font-size:18px}
.alert.red .ic{background:var(--red-bg)}
.alert b{display:block;font-weight:700}
.alert small{font-size:12.5px;color:var(--muted)}
.alert .chev{margin-left:auto;color:#94a3b8;font-size:20px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--sky);border-radius:16px;padding:12px 4px;text-align:center;font-size:11.5px;font-weight:600;line-height:1.3;transition:transform .15s}
.tile span{display:block;font-size:20px;margin-bottom:4px}
.tile:active{transform:scale(.96)}
.goal .hint{font-size:12.5px;color:var(--orange-ink);font-weight:600;margin-top:2px}
.goal .hint.ok{color:var(--green)}
.row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:10px}
.row b{color:var(--text)}
.bar{height:12px;background:var(--line);border-radius:999px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--navy);transition:width .6s cubic-bezier(.4,0,.2,1)}
.bar.thin{height:8px}
.bar.green i{background:var(--green)}
.bar.orange i{background:var(--orange)}
.task{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;user-select:none}
.task:first-of-type{border-top:0}
.box{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid #cbd5e1;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;transition:all .25s cubic-bezier(.34,1.56,.64,1)}
.task.done .box{background:var(--green);border-color:var(--green);transform:scale(1.05)}
.task.done .box::after{content:"✓"}
.task .tx{flex:1;font-size:14px}
.task.done .tx{color:#94a3b8;text-decoration:line-through}
.task .lnk{display:block;font-size:12px;color:var(--muted);text-decoration:underline;margin-top:2px}
.tag{flex:none;font-size:10.5px;font-weight:700;border-radius:999px;padding:3px 9px;letter-spacing:.02em}
.tag.alta{background:var(--red-bg);color:var(--red-ink)} .tag.media{background:var(--orange-bg);color:var(--orange-ink)} .tag.baixa{background:var(--green-bg);color:var(--green)}
.task.done .tag{opacity:.4}
.alldone{display:none;margin-top:10px;background:var(--green-bg);color:var(--green);border-radius:14px;padding:12px;text-align:center;font-weight:700}
.prod{display:flex;justify-content:space-between;font-size:14px;margin-top:12px}
.prod:first-of-type{margin-top:12px}
.counts{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12.5px;color:var(--muted)}
.counts b{display:block;font-size:22px;color:var(--text);font-weight:800}
.meter{margin-top:12px}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--navy);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(15,42,74,.3);transition:all .3s;pointer-events:none;z-index:10;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:18px}
.install{display:none;margin-top:12px;width:100%;border:0;background:var(--orange);color:#fff;font:700 14px Inter,system-ui;border-radius:14px;padding:12px;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="logo">smart<i>.</i>docs</div><div class="avatar">B</div></div>
  <div class="date" id="hoje"></div>
  <h1>Olá, Beatriz!</h1>

  <div class="layout">
    <div class="col">
      <div class="hero">
        <div class="lbl">Vendas da semana · ML + Shopee</div>
        <div class="big" id="total">—</div>
        <div class="pills" id="pills"></div>
      </div>
      <div id="alertas" class="col"></div>
      <div class="tiles">
        <a class="tile" href="https://www.mercadolivre.com.br/vendas/omni/lista" target="_blank" rel="noopener"><span>🛍️</span>Vendas ML</a>
        <a class="tile" href="https://seller.shopee.com.br/portal/sale/order" target="_blank" rel="noopener"><span>🧡</span>Shopee</a>
        <a class="tile" href="https://www.mercadolivre.com.br/anuncios/lista" target="_blank" rel="noopener"><span>📋</span>Anúncios</a>
        <a class="tile" href="https://www.mercadolivre.com.br/perguntas/vendedor" target="_blank" rel="noopener"><span>💬</span>Perguntas</a>
      </div>
      <div class="card goal">
        <h2>Meta da semana</h2>
        <div class="hint" id="goalHint"></div>
        <div class="row"><span id="goalVal"></span><span id="goalPct"></span></div>
        <div class="bar"><i id="goalBar" style="width:0"></i></div>
      </div>
      <div class="card">
        <h2>Reputação ML</h2>
        <div id="rep"></div>
      </div>
    </div>

    <div class="col">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center"><h2>Tarefas</h2><span style="font-size:12.5px;color:var(--muted)" id="tProg"></span></div>
        <div class="bar thin green" style="margin:10px 0 6px"><i id="tBar" style="width:0"></i></div>
        <div id="tarefas"></div>
        <div class="alldone" id="alldone">🎉 Tudo feito! Mandou bem.</div>
      </div>
      <div class="card">
        <h2>Mais vendidos</h2>
        <div id="top"></div>
      </div>
      <div class="card counts" id="counts"></div>
      <button class="install" id="install">📲 Instalar o app no celular</button>
    </div>
  </div>
  <div class="foot" id="upd"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const brl = v => v.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const pct = v => v.toLocaleString('pt-BR', {maximumFractionDigits:1}) + '%';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);
$('hoje').textContent = new Date().toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'});

const KEY = 'painel-tarefas-v1';
const done = JSON.parse(localStorage.getItem(KEY) || '{}');
let toastT;
const toast = m => { $('toast').textContent = m; $('toast').classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => $('toast').classList.remove('show'), 2200); };

fetch('data.json?v=' + Date.now()).then(r => r.json()).then(d => {
  const m = d.ml, s = d.shopee;
  const total = (m.vendas_brutas || 0) + (s.vendas_brutas || 0);
  $('total').textContent = brl(total);
  $('pills').innerHTML = [`${m.vendas + (s.pedidos || 0)} vendas`, `${m.visitas} visitas`, `${pct(m.conversao)} conv.`]
    .map(t => `<span class="pill">${t}</span>`).join('');

  // alertas: envios + reputação
  const al = d.envios.map(e => `<div class="alert"><div class="ic">🚚</div><div><b>Envio ${esc(e.data)}</b><small>${esc(e.item)}</small></div><span class="chev">›</span></div>`);
  if (m.alerta_reputacao) al.push(`<div class="alert red"><div class="ic">⚠️</div><div><b>Reputação: ${esc(m.alerta_reputacao.toLowerCase())}</b><small>${pct(m.envios_incorretos)} de atraso · limite ${pct(m.envios_limite)}</small></div><span class="chev">›</span></div>`);
  $('alertas').innerHTML = al.join('');
  if (!al.length) $('alertas').style.display = 'none';

  // meta
  const meta = d.meta_semana || 200, p = Math.min(100, Math.round(total / meta * 100));
  $('goalVal').innerHTML = `<b>${brl(total)}</b> / ${brl(meta)}`;
  $('goalPct').textContent = p + '%';
  $('goalHint').textContent = total >= meta ? '🏆 Meta batida! Parabéns!' : `💰 Faltam ${brl(meta - total)} para bater a meta`;
  $('goalHint').classList.toggle('ok', total >= meta);
  requestAnimationFrame(() => $('goalBar').style.width = Math.max(p, 2) + '%');

  // reputação
  const meter = (l, v, lim) => { const q = Math.min(100, v / lim * 100), cls = q >= 70 ? '' : q >= 40 ? 'orange' : 'green';
    return `<div class="meter"><div class="row" style="margin:0"><span>${l}</span><span><b>${pct(v)}</b> / ${pct(lim)}</span></div><div class="bar thin ${cls}" ${q >= 70 ? 'style="--x:1"' : ''}><i style="width:${Math.max(q, 2)}%;${q >= 70 ? 'background:var(--red)' : ''}"></i></div></div>`; };
  $('rep').innerHTML = `<div style="font-size:13px;color:var(--green);font-weight:700;margin-top:4px">● ${esc(m.reputacao)}</div>` +
    meter('Envios com atraso', m.envios_incorretos, m.envios_limite) + meter('Reclamações', m.reclamacoes, m.reclamacoes_limite) + meter('Canceladas', m.canceladas, m.canceladas_limite);

  // tarefas
  const ordem = {alta:0, media:1, baixa:2}, nomes = {alta:'URGENTE', media:'SEMANA', baixa:'DEPOIS'};
  const lista = [...d.tarefas].sort((a, b) => ordem[a.prioridade] - ordem[b.prioridade]);
  const atualiza = () => {
    const n = lista.filter(t => done[t.id]).length, q = lista.length ? Math.round(n / lista.length * 100) : 0;
    $('tProg').textContent = `${n} de ${lista.length} · ${q}%`;
    $('tBar').style.width = Math.max(q, 2) + '%';
    $('alldone').style.display = lista.length && n === lista.length ? 'block' : 'none';
    return n;
  };
  $('tarefas').innerHTML = lista.map(t => `
    <div class="task ${done[t.id] ? 'done' : ''}" data-id="${esc(t.id)}" role="checkbox" aria-checked="${!!done[t.id]}" tabindex="0">
      <span class="box"></span>
      <span class="tx">${esc(t.icone || '✅')} ${esc(t.texto)}${t.link ? `<a class="lnk" href="${esc(t.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">abrir link</a>` : ''}</span>
      <span class="tag ${t.prioridade}">${nomes[t.prioridade] || ''}</span>
    </div>`).join('');
  const alterna = el => {
    const id = el.dataset.id; done[id] = !done[id]; localStorage.setItem(KEY, JSON.stringify(done));
    el.classList.toggle('done', done[id]); el.setAttribute('aria-checked', done[id]);
    const n = atualiza();
    if (navigator.vibrate && done[id]) navigator.vibrate(15);
    toast(done[id] ? (n === lista.length ? '🎉 Todas feitas!' : `✓ Feito! ${n} de ${lista.length}`) : 'Tarefa reaberta');
  };
  $('tarefas').addEventListener('click', e => { const el = e.target.closest('.task'); if (el) alterna(el); });
  $('tarefas').addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && e.target.classList.contains('task')) { e.preventDefault(); alterna(e.target); } });
  atualiza();

  // mais vendidos
  const max = Math.max(1, ...m.top.map(t => t.valor));
  $('top').innerHTML = m.top.length ? m.top.map(t => `<div class="prod"><span>${esc(t.nome)}</span><b>${brl(t.valor)}</b></div>
    <div class="bar thin orange" style="margin-top:6px"><i style="width:${Math.max(t.valor / max * 100, 3)}%"></i></div>`).join('')
    : '<p style="color:var(--muted);font-size:13px">Sem vendas na semana.</p>';

  $('counts').innerHTML = `<div><b>${m.anuncios}</b>anúncios no ML</div><div><b>${s.produtos_ativos}</b>produtos na Shopee</div>`;
  $('upd').textContent = `Atualizado em ${d.atualizado} · ${d.periodo}`;
}).catch(() => { $('upd').textContent = 'Sem conexão: mostrando a última versão salva.'; });

// app instalável
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
let prompt;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); prompt = e; $('install').style.display = 'block'; });
$('install').onclick = async () => { if (!prompt) return; prompt.prompt(); await prompt.userChoice; prompt = null; $('install').style.display = 'none'; };
</script>
</body>
</html>
